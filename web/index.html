<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Robot DINAVEX</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
            padding: 30px;
        }

        .contenedor {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 400px;
            margin: auto;
        }

        h1 {
            color: #154c79;
        }

        .valor {
            font-size: 40px;
            font-weight: bold;
            color: #154c79;
        }

        .estado {
            font-weight: bold;
        }

        .conectado {
            color: green;
        }

        .desconectado {
            color: red;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <h1>DINAVEX</h1>

        <h3>Robot Autoequilibrado</h3>

        <hr>

        <p>Conexión ROS 2:</p>

        <p id="conexion"
           class="estado desconectado">
            Desconectado
        </p>

        <hr>

        <h3>Ángulo</h3>

        <div id="angulo" class="valor">
            --°
        </div>

        <h3>Velocidad angular</h3>

        <div id="velocidad" class="valor">
            -- °/s
        </div>

        <hr>

        <p id="estado">
            Esperando datos...
        </p>

    </div>

    <script>

        let websocket;
        let temporizador;

        function conectarROS() {

            // Conectarse al WebSocket
            // de la Raspberry Pi

            websocket = new WebSocket(
                "ws://" + window.location.hostname + ":9090"
            );

            websocket.onopen = function() {

                document.getElementById(
                    "conexion"
                ).innerText = "Conectado";

                document.getElementById(
                    "conexion"
                ).className = "estado conectado";

                // Suscribirse al tópico ROS 2

                websocket.send(JSON.stringify({
                    op: "subscribe",
                    topic: "/datos_stm32",
                    type: "std_msgs/msg/String"
                }));

            };

            websocket.onmessage = function(event) {

                try {

                    let mensaje = JSON.parse(event.data);

                    if (
                        mensaje.op !== "publish" ||
                        mensaje.topic !== "/datos_stm32"
                    ) {
                        return;
                    }

                    let datos = JSON.parse(
                        mensaje.msg.data
                    );

                    document.getElementById(
                        "angulo"
                    ).innerText = datos.angulo + "°";

                    document.getElementById(
                        "velocidad"
                    ).innerText =
                        datos.velocidad_angular + " °/s";

                    document.getElementById(
                        "estado"
                    ).innerText = datos.estado;

                } catch (error) {
                    console.error(
                        "Error al procesar datos:",
                        error
                    );
                }

            };

            websocket.onclose = function() {

                document.getElementById(
                    "conexion"
                ).innerText = "Desconectado";

                document.getElementById(
                    "conexion"
                ).className = "estado desconectado";

                document.getElementById(
                    "estado"
                ).innerText = "Sin conexión ROS 2";

                // Reconectar automáticamente

                clearTimeout(temporizador);

                temporizador = setTimeout(
                    conectarROS,
                    3000
                );

            };

            websocket.onerror = function() {
                websocket.close();
            };

        }

        conectarROS();

    </script>

</body>
</html>
